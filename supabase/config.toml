# Supabase CLI yapılandırması (supabase start / supabase db reset / supabase functions serve).
project_id = "menu-atlasi"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "menuatlasi://**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# E-posta doğrulaması zorunlu
enable_confirmations = true
double_confirm_changes = true

[functions.delete-account]
verify_jwt = true

[functions.menu-import]
verify_jwt = true
