# Yerel API ağ geçidi: Supabase istemci kütüphanelerinin beklediği yol düzeni.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 8000;
  client_max_body_size 60m;

  # CORS (yalnızca yerel geliştirme)
  add_header Access-Control-Allow-Origin * always;
  add_header Access-Control-Allow-Headers "authorization, x-client-info, apikey, content-type, accept-profile, content-profile, prefer, range, x-upsert, cache-control, x-supabase-api-version" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD" always;
  add_header Access-Control-Expose-Headers "content-range, content-length, sb-error-code" always;
  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Headers;
  proxy_hide_header Access-Control-Allow-Methods;
  proxy_hide_header Access-Control-Expose-Headers;
  proxy_hide_header Access-Control-Allow-Credentials;

  location = /health { return 200 'ok'; }

  location /auth/v1/ {
    if ($request_method = OPTIONS) { return 204; }
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
  }
  location /rest/v1/ {
    if ($request_method = OPTIONS) { return 204; }
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
  }
  location /storage/v1/ {
    if ($request_method = OPTIONS) { return 204; }
    proxy_pass http://storage:5000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /storage/v1;
  }
  location /functions/v1/ {
    if ($request_method = OPTIONS) { return 204; }
    proxy_pass http://functions:9000/;
    proxy_set_header Host $host;
    proxy_read_timeout 160s;
  }
}
