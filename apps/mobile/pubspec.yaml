publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  supabase_flutter: ^2.18.3
  google_maps_flutter: ^2.19.0
  geolocator: ^14.1.2
  url_launcher: ^6.3.3
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  cached_network_image: ^4.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:

  uses-material-design: true
